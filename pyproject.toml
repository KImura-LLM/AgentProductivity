[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-productivity"
version = "0.1.0"
description = "Personal Productivity AI Agent for Telegram, Notion, TickTick, and OpenAI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "dateparser>=1.2.0,<2.0",
  "httpx>=0.27.0,<1.0",
  "openai>=2.0.0,<3.0",
  "pydantic>=2.7.0,<3.0",
  "pydantic-settings>=2.2.0,<3.0",
  "python-dotenv>=1.0.1,<2.0",
  "python-telegram-bot[job-queue]>=21.7,<22.0",
  "rapidfuzz>=3.9.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0",
  "pytest-asyncio>=0.23.0,<1.0",
  "ruff>=0.6.0,<1.0",
]

[project.scripts]
agent-productivity = "productivity_agent.main:main"
agent-productivity-cli = "productivity_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/productivity_agent"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
